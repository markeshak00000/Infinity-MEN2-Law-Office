name: Build Infinity MEN2 Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Get project files
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Java for Android build
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project packages
        run: npm install --no-audit --no-fund

      - name: Check project files
        run: npm run check

      - name: Generate Android project and app icons
        run: npm run android:add

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK to Actions
        uses: actions/upload-artifact@v7
        with:
          name: Infinity-MEN2-Law-Office-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Show download instructions in the run summary
        if: success()
        run: |
          echo '## Infinity MEN2 Android APK' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'The APK was built successfully. Open the **Artifacts** section below this run and download **Infinity-MEN2-Law-Office-Android-APK**.' >> "$GITHUB_STEP_SUMMARY"
